<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D91800" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07060E"  media="(prefers-color-scheme: dark)"  />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnimaFilm" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>AnimaFilm — Series de tu infancia</title>
    <meta name="description" content="Puntúa y recuerda las series animadas de la infancia española, de los años 70 hasta los 2000." />
    <meta property="og:title" content="AnimaFilm" />
    <meta property="og:description" content="Las series animadas de tu infancia española" />
    <meta property="og:type" content="website" />

    <!-- Sin FOUC en dark mode -->
    <script>
      (function () {
        var theme = localStorage.getItem("animafilm_theme")
          || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.backgroundColor = theme === "dark" ? "#0B0A14" : "#F3E9C8";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registrar Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
