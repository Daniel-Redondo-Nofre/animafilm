<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="theme-color" content="#C21500" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07060E"  media="(prefers-color-scheme: dark)"  />

    <!-- SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!-- Preconexión a Supabase: el catálogo (y con él las URLs de los
         pósters) sale de ahí. Adelantar el handshake TLS recorta unos
         200-300 ms de la cadena crítica. -->
    <link rel="preconnect" href="https://pfmanlydpkmwwxzldhpg.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://pfmanlydpkmwwxzldhpg.supabase.co" />
    <!-- Las fuentes las inyecta theme-init.js sin bloquear el pintado.
         El preload las pone en cola desde ya. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&display=swap" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&display=swap" />
    </noscript>
    <title>AnimaFilm — Series de tu infancia</title>
    <meta name="description" content="Puntúa y recuerda las series animadas de la infancia española, de los años 70 hasta los 2000." />
    <meta property="og:title" content="AnimaFilm" />
    <meta property="og:description" content="Las series animadas de tu infancia española" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnimaFilm" />
    <meta property="og:locale" content="es_ES" />
    <link rel="canonical" href="https://animafilm.vercel.app/" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Tema aplicado antes del primer pintado -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Limpieza del service worker de la versión PWA anterior -->
    <script src="/sw-cleanup.js" defer></script>
  </body>
</html>
